<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; background: #12121a; color: white; font-family: sans-serif; text-align: center; padding-top: 50px; overflow: hidden; }
        .case-container { background: #1e1e2b; margin: 0 20px; border-radius: 20px; padding: 20px; border: 1px solid #333; }
        .case-img { font-size: 60px; margin-bottom: 10px; }
        .case-title { font-size: 20px; font-weight: bold; margin-bottom: 20px; }
        .open-btn { background: #ffa502; color: #000; border: none; padding: 15px 40px; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s; }
        .open-btn:active { transform: scale(0.95); }
        
        /* Анимация ленты */
        .roulette-container { width: 100%; overflow: hidden; position: relative; height: 120px; background: #0d0d14; border-top: 2px solid #333; border-bottom: 2px solid #333; margin-top: 30px; display: none; }
        .roulette-strip { display: flex; position: absolute; transition: transform 5s cubic-bezier(0.1, 0.8, 0.1, 1); }
        .item { width: 100px; height: 120px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 40px; border-right: 1px solid #222; }
        
        .pointer-center { position: absolute; left: 50%; top: 0; height: 100%; width: 2px; background: #ffa502; z-index: 10; box-shadow: 0 0 10px #ffa502; }
    </style>
</head>
<body>
    <div class="case-container">
        <div class="case-img">📦</div>
        <div class="case-title">Кейс "Новичок"</div>
        <button class="open-btn" onclick="openCase()">Открыть за 100 ⭐</button>
    </div>

    <div class="roulette-container" id="roulette">
        <div class="pointer-center"></div>
        <div class="roulette-strip" id="strip"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Предметы в кейсе (эмодзи-заглушки)
        const items = ["🎁", "🍕", "💎", "🚀", "🐶", "🍀", "🍺", "🧸", "🎩", "👑"];

        function openCase() {
            // В реальности здесь отправка запроса боту на списание звезд
            // Пока имитируем открытие
            
            document.getElementById('roulette').style.display = 'block';
            const strip = document.getElementById('strip');
            strip.innerHTML = "";
            
            // Генерируем 30 случайных предметов для ленты
            for (let i = 0; i < 30; i++) {
                const div = document.createElement('div');
                div.className = 'item';
                div.innerText = items[Math.floor(Math.random() * items.length)];
                strip.appendChild(div);
            }
            
            // Сбрасываем позицию
            strip.style.transition = 'none';
            strip.style.transform = `translateX(0px)`;
            
            // Запускаем анимацию
            setTimeout(() => {
                strip.style.transition = 'transform 5s cubic-bezier(0.1, 0.8, 0.1, 1)';
                // Едем влево (3000px), чтобы остановиться на выигрыше
                strip.style.transform = `translateX(-3000px)`;
            }, 50);
        }
    </script>
</body>
</html>
