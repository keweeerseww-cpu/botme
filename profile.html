<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; background: #12121a; color: white; font-family: -apple-system, BlinkMacSystemFont, sans-serif; height: 100vh; overflow-y: auto; }
        .header { background: linear-gradient(135deg, #2b5278, #182533); padding: 40px 20px 20px; text-align: center; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; position: relative; }
        .avatar { width: 100px; height: 100px; border-radius: 50%; background: #ffa502; margin: 0 auto; display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: bold; color: #000; border: 4px solid #12121a; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .name { margin-top: 15px; font-size: 22px; font-weight: bold; }
        .username { color: #888; font-size: 14px; margin-top: 5px; }
        .bio { margin-top: 10px; font-size: 14px; color: #ccc; padding: 0 20px; }
        
        .edit-btn { margin-top: 15px; background: #2b5278; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 80%; }
        
        .vitrina { margin-top: 20px; padding: 20px; }
        .vitrina-title { font-size: 16px; font-weight: bold; margin-bottom: 10px; color: #ffa502; }
        .nft-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .nft-item { background: #1e1e2b; border-radius: 10px; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 30px; border: 1px solid #333; }
    </style>
</head>
<body>
    <div class="header">
        <div class="avatar" id="avatar">👤</div>
        <div class="name" id="name">Ваше Имя</div>
        <div class="username" id="username">@ваш_ник</div>
        <div class="bio" id="bio">Ваша биография...</div>
        <button class="edit-btn" onclick="editProfile()">✏️ Редактировать профиль</button>
    </div>

    <div class="vitrina">
        <div class="vitrina-title">📦 Моя витрина</div>
        <div class="nft-grid">
            <div class="nft-item">🎁</div>
            <div class="nft-item">🍕</div>
            <div class="nft-item">💎</div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        // Загружаем профиль
        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('name').innerText = user.first_name + " " + (user.last_name || "");
            document.getElementById('username').innerText = "@" + (user.username || "no_username");
            document.getElementById('avatar').innerText = user.first_name[0];
        }

        // Редактирование (отправляем данные боту)
        function editProfile() {
            const newName = prompt("Введите новое имя:", document.getElementById('name').innerText);
            if (newName) {
                document.getElementById('name').innerText = newName;
                // Отправляем данные боту для сохранения
                tg.sendData(JSON.stringify({ action: "update_profile", name: newName }));
            }
        }
    </script>
</body>
</html>
