<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; background: #12121a; color: white; font-family: sans-serif; padding-bottom: 20px; }
        .header { text-align: center; padding: 30px 20px; background: #1e1e2b; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; }
        .avatar { width: 100px; height: 100px; border-radius: 50%; background: #333; display: flex; align-items: center; justify-content: center; font-size: 40px; margin: 0 auto; cursor: pointer; border: 3px solid #ffa502; object-fit: cover; }
        .name { margin-top: 15px; font-size: 20px; font-weight: bold; }
        .username { color: #888; font-size: 14px; }
        
        .gifts-section { padding: 20px; }
        .gift-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .gift-card { background: #1e1e2b; padding: 15px; border-radius: 15px; text-align: center; border: 1px solid #333; }
        .gift-emoji { font-size: 40px; }
        .gift-name { margin: 10px 0; font-weight: bold; font-size: 14px; }
        .gift-rarity { color: #ffa502; font-size: 12px; }
        
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        .btn { flex: 1; padding: 8px; border: none; border-radius: 8px; font-weight: bold; font-size: 12px; cursor: pointer; }
        .btn-upgrade { background: #2b5278; color: white; }
        .btn-sell { background: #ff4757; color: white; }

        /* Редкие фоны (Черный - самый дорогой) */
        .bg-black { background: #000 !important; border: 2px solid #ffffff !important; box-shadow: 0 0 15px rgba(255,255,255,0.3); }
        .bg-red { background: #ff4757 !important; }
        .bg-blue { background: #3742fa !important; }
        .bg-green { background: #2ed573 !important; }
    </style>
</head>
<body>
    <div class="header">
        <img class="avatar" id="avatarImg" src="https://via.placeholder.com/100" onclick="changeAvatar()">
        <div class="name" id="name">Загрузка...</div>
        <div class="username" id="username">@user</div>
    </div>

    <div class="gifts-section">
        <h3>🎁 Мои подарки</h3>
        <div class="gift-grid" id="giftGrid"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        // Получаем данные пользователя
        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('name').innerText = user.first_name;
            document.getElementById('username').innerText = "@" + (user.username || "user");
        }

        // Смена аватарки (отправляем боту ссылку или файл)
        function changeAvatar() {
            const url = prompt("Вставьте ссылку на картинку (или загрузите через бота):");
            if (url) {
                document.getElementById('avatarImg').src = url;
                tg.sendData(JSON.stringify({ action: "update_avatar", url: url }));
            }
        }

        // Загрузка подарков (заглушка для примера, в реальности бот пришлет данные)
        const gifts = [
            { id: 1, name: "Мишка", emoji: "🧸", rarity: "Обычный", bg: "" },
            { id: 2, name: "Звезда", emoji: "⭐", rarity: "Редкий", bg: "bg-blue" }
        ];

        function renderGifts() {
            const grid = document.getElementById('giftGrid');
            grid.innerHTML = "";
            gifts.forEach(g => {
                const card = document.createElement('div');
                card.className = `gift-card ${g.bg}`;
                card.innerHTML = `
                    <div class="gift-emoji">${g.emoji}</div>
                    <div class="gift-name">${g.name}</div>
                    <div class="gift-rarity">${g.rarity}</div>
                    <div class="btn-group">
                        <button class="btn btn-upgrade" onclick="upgradeGift(${g.id})">Улучшить</button>
                        <button class="btn btn-sell" onclick="sellGift(${g.id})">Продать</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function upgradeGift(id) {
            // Отправляем запрос боту на улучшение
            tg.sendData(JSON.stringify({ action: "upgrade_gift", gift_id: id }));
            alert("Запрос на улучшение отправлен боту!");
        }

        function sellGift(id) {
            const price = prompt("Введите цену для продажи (в ⭐):");
            if (price) {
                tg.sendData(JSON.stringify({ action: "sell_gift", gift_id: id, price: price }));
                alert(`Подарок выставлен на рынок за ${price} ⭐`);
            }
        }

        renderGifts();
    </script>
</body>
</html>
